[profile.default]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Interface-only fork PoC -- no RealT source is compiled; the test calls the LIVE
# deployed contracts on a Gnosis fork through minimal interfaces. Only forge-std is needed:
#   forge install foundry-rs/forge-std --no-git   (lib/ is gitignored repo-wide)
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
gnosis = "https://rpc.gnosischain.com"
