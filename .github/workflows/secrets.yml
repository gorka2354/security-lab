name: secrets-sweep
# Weekly SECRETS sweep — scans the public repos of live protocols (monitor/repos.json) for committed
# keys/creds in tree + git history (the Taiko/Raiko enclave-key class). Separate from the 3h radar because
# clones (hunts/_volume, gitignored) don't persist across Actions runs, so each run re-clones — too heavy
# for 3h, fine weekly. Correctness holds across fresh clones because the seen-state (committed) dedups, so
# a given leak still alerts only once. Commits seen-state + SECRETS.md back for the session-start brief.
on:
  schedule:
    - cron: '23 6 * * 1'         # Mondays 06:23 UTC
  workflow_dispatch: {}           # manual run button

permissions:
  contents: write

concurrency:
  group: secrets-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: secrets sweep
        run: |
          python toolkit/secrets_sweep.py || true   # exit 10 = NEW committed key queued, not a failure
      - name: commit secrets state
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar@security-lab.local"
          git add -f monitor/repos.json monitor/secrets-seen.json hunts/_radar/SECRETS.md
          git diff --cached --quiet || git commit -m "chore(secrets): sweep state $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase --autostash || true
          git push
