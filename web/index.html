<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>security-lab · dashboard</title>
<!--
  Inc 2 of the platform (research/platform/DESIGN-platform.md): READ-ONLY view over the lab-state CONTRACT.
  Self-contained (no framework, no CDN, works offline). Fetches /monitor/lab-state.json, so serve from the
  repo root: `python toolkit/dashboard.py` (regenerates the contract + opens this). Mutations are NOT here
  (stdio MCP can't reach a browser) — they arrive in Inc 3/4 via the localhost HTTP bridge.
-->
<style>
  :root{
    --bg:#0c0f14; --panel:#11161f; --panel2:#161d28; --line:#232c3a; --txt:#cdd6e4; --dim:#7c8aa0;
    --real:#ff5c7a; --dig:#ffb454; --park:#5cc8ff; --skip:#5a6678; --clean:#3fb37f; --acc:#8a7cff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 var(--mono);}
  a{color:var(--park);text-decoration:none}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;letter-spacing:.5px}
  header h1 b{color:var(--real)}
  .gen{color:var(--dim);font-size:12px}
  .tiles{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
  .tile .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .tile .v{font-size:20px;font-weight:600;margin-top:2px}
  section{padding:8px 20px 20px}
  h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;font-weight:600}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:60px;max-height:62vh;
    overflow:auto;display:flex;flex-direction:column}
  .col h3{font-size:12px;margin:0;padding:8px 10px;position:sticky;top:0;background:var(--panel2);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .col h3 .n{color:var(--dim)}
  .card{padding:7px 10px;border-bottom:1px solid var(--line)}
  .card:last-child{border-bottom:0}
  .card .nm{font-weight:600;display:flex;gap:6px;align-items:center}
  .card .meta{color:var(--dim);font-size:11px;margin-top:2px}
  .badge{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
  .lock{color:var(--dig);border-color:var(--dig)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .d-REAL{background:var(--real)} .d-DIG{background:var(--dig)} .d-PARK{background:var(--park)}
  .d-SKIP{background:var(--skip)} .d-CLEAN{background:var(--clean)}
  .h-REAL{color:var(--real)} .h-DIG{color:var(--dig)} .h-PARK{color:var(--park)}
  .h-SKIP{color:var(--skip)} .h-CLEAN{color:var(--clean)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .sub{color:var(--dim);font-size:11px}
  .fresh{color:var(--dig)} .quiet{color:var(--clean)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:6px 14px;border-bottom:1px solid var(--line);font-size:12px}
  th{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  .pill{font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line)}
  .st-accepted,.st-fixed-silent,.st-duplicate{color:var(--clean);border-color:var(--clean)}
  .st-withdrawn,.st-disputed{color:var(--skip);border-color:var(--skip)}
  .st-drafted,.st-parked{color:var(--dig);border-color:var(--dig)}
  .k-live{color:var(--clean);border-color:var(--clean)}
  .k-non-live{color:var(--skip);border-color:var(--skip)}
  tr.nonlive td{opacity:.62}
  #verdictbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #verdictbar .vlabel{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  #verdictbar input,#verdictbar select{background:var(--bg);color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font:12px var(--mono)}
  #verdictbar input#v_reason{flex:1;min-width:160px}
  #verdictbar button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;
    font:12px var(--mono);cursor:pointer}
  #verdictbar button:disabled{opacity:.5;cursor:default}
  .vmsg{font-size:12px}.vmsg.ok{color:var(--clean)}.vmsg.bad{color:var(--real)}
  .card.clickable{cursor:pointer} .card.clickable:hover{background:var(--panel2)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;padding:40px 16px;overflow:auto}
  .modal.show{display:flex;justify-content:center;align-items:flex-start}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;
    padding:0;box-shadow:0 12px 48px rgba(0,0,0,.5)}
  .modal-card .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal-card .mh h2{margin:0;font-size:15px;text-transform:none;letter-spacing:0;color:var(--txt)}
  .modal-card .mh .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:18px;border:0;background:none}
  .modal-card .mb{padding:14px 18px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:12px;margin-bottom:12px}
  .kv .k{color:var(--dim)}
  .vlist .vi{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:12px}
  .vlist .vi .vt{color:var(--dim)}
  .find{border:1px solid var(--clean);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
  .fchip{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;padding:3px 8px;margin:3px 4px 0 0;
    border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .fchip:hover{background:var(--panel2);border-color:var(--acc)}
  .dchip{display:inline-block;font-size:11px;padding:2px 7px;margin:3px 4px 0 0;border-radius:6px;border:1px solid var(--line)}
  .dchip.d-v{color:var(--real);border-color:var(--real)} .dchip.d-s{color:var(--clean);border-color:var(--clean)}
  .dchip.d-n{color:var(--dim)}
  .mh2{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  .logf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .logf input,.logf select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;
    padding:5px 8px;font:12px var(--mono)} .logf input.t{flex:1;min-width:180px}
  .logf button{background:var(--clean);color:#06281c;border:0;border-radius:6px;padding:6px 12px;font:12px var(--mono);cursor:pointer;font-weight:600}
  .err{padding:40px 20px;color:var(--real)}
  .foot{color:var(--dim);padding:10px 20px 30px;font-size:11px;border-top:1px solid var(--line);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1><b>security</b>-lab · dashboard</h1>
  <span class="gen" id="gen">loading…</span>
  <span class="gen" style="margin-left:auto" id="subtitle">lab-state contract · white-hat</span>
  <button id="langbtn" class="badge" style="cursor:pointer" title="язык / language">RU</button>
</header>
<div id="verdictbar">
  <span class="vlabel" id="lbl_rv">record verdict:</span>
  <input id="v_target" placeholder="target name" list="targetlist" autocomplete="off">
  <datalist id="targetlist"></datalist>
  <select id="v_verdict">
    <option value="todo">todo</option><option value="real">real</option><option value="fp">fp</option>
    <option value="known">known</option><option value="wontfix">wontfix</option>
  </select>
  <input id="v_reason" placeholder="reason (why)" autocomplete="off">
  <button id="v_btn">save → ledger</button>
  <span id="v_msg" class="vmsg"></span>
</div>
<div id="app"><div class="err" id="err" style="display:none"></div></div>
<div class="foot" id="foot">
  source: <code>monitor/lab-state.json</code> (read-through projection) · serve via
  <code>python toolkit/dashboard.py</code> · mutations land in Inc 3/4 (MCP + HTTP bridge)
</div>

<script>
const COLS = ["REAL","DIG","PARK","SKIP","CLEAN"];      // logical pipeline columns
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOKEN = new URLSearchParams(location.search).get("token") || "";  // for the public/LAN bridge
const apiUrl = p => p + (TOKEN ? (p.includes("?")?"&":"?")+"token="+encodeURIComponent(TOKEN) : "");

// --- i18n: an extensible string map (ru default + en). Translate the UI CHROME only; data (target names,
// zones, verdict codes) stays as-is. Add a language by adding a key block; t() falls back ru->en->key. ---
const I18N = {
  ru:{ subtitle:"контракт lab-state · white-hat", loading:"загрузка…", generated:"сгенерировано",
    pub:"ПУБЛИЧНЫЙ (очищено)", record_verdict:"записать вердикт:", target_name:"имя цели",
    reason_why:"причина (почему)", save_ledger:"в ledger →", reason_req:"нужны цель + причина",
    saving:"сохранение…", saved:"сохранено", bridge_off:"мост офлайн — запусти dashboard.py",
    t_targets:"цели", t_real_dig:"REAL / DIG", t_findings:"находки", t_parked:"паркинг",
    t_repos:"репо под наблюдением", t_precision:"точность", t_recall:"полнота",
    pipeline:"Конвейер", targets_n:"целей", verdict_one:"вердикт", verdict_few:"вердикта", verdict_many:"вердиктов",
    more:"ещё", radars:"Радары", r_change:"радар изменений", r_fresh_deploy:"свежие деплои",
    r_fresh_feed:"свежий фид", r_secrets:"свип секретов", r_impl:"апгрейды impl", r_bounty:"запуски баунти",
    r_watched:"деплоеров под наблюдением", r_listed:"листингов видено", r_repos:"репо", r_leaks:"утечек",
    fresh:"СВЕЖЕЕ", quiet:"тихо", findings_lc:"Находки (жизненный цикл)", no_findings:"нет отслеживаемых находок",
    th_target:"цель", th_class:"класс", th_sev:"критичность", th_status:"статус", th_bounty:"баунти",
    k_live:"live", k_nonlive:"non-live", lf_kind:"класс:", nonlive_hint:"non-live = реальный баг, но цель мёртвая/пустая/невызываемая (нет живого импакта)",
    parked_leads:"Запаркованные лиды", none_parked:"нет запаркованных", fires:"сработает",
    parked_hidden:"запаркованных — детали скрыты в публичном режиме", m_findings:"Находки",
    no_finding_t:"находок по этой цели нет", m_verdicts:"Вердикты", no_verdicts:"вердиктов пока нет",
    fork_family:"форк-семья", no_siblings:"нет сиблингов в реестре", jump_hint:"клик по сиблингу — прыжок (batch-CVE)",
    known_bugs:"известные баги (fingerprint)",
    kv_zones:"зоны", kv_chains:"сети", kv_fork:"форк-база", kv_owasp:"owasp", kv_sources:"источники",
    kv_first:"впервые", kv_updated:"обновлено", log_finding:"Записать находку (→ ledger + дашборд, один шаг)",
    finding_title:"название находки", log_btn:"записать → находку", title_req:"нужно название",
    logged:"записано", failed:"ошибка", err_load:"Не удалось загрузить lab-state",
    err_serve:"Запусти из корня репо:", err_file:"Открытие через file:// не сработает (CORS + путь).",
    foot:'источник: <code>monitor/lab-state.json</code> (read-through проекция) · запуск через <code>python toolkit/dashboard.py</code> · мутации идут через MCP + HTTP-мост' },
  en:{ subtitle:"lab-state contract · white-hat", loading:"loading…", generated:"generated",
    pub:"PUBLIC (sanitized)", record_verdict:"record verdict:", target_name:"target name",
    reason_why:"reason (why)", save_ledger:"save → ledger", reason_req:"target + reason required",
    saving:"saving…", saved:"saved", bridge_off:"bridge offline — run dashboard.py",
    t_targets:"targets", t_real_dig:"REAL / DIG", t_findings:"findings", t_parked:"parked",
    t_repos:"repos watched", t_precision:"precision", t_recall:"recall",
    pipeline:"Pipeline", targets_n:"targets", verdict_one:"verdict", verdict_few:"verdicts", verdict_many:"verdicts",
    more:"more", radars:"Radars", r_change:"change radar", r_fresh_deploy:"fresh-deploy",
    r_fresh_feed:"fresh-feed", r_secrets:"secrets-sweep", r_impl:"impl-upgrades", r_bounty:"bounty-launches",
    r_watched:"watched deployer(s)", r_listed:"listed seen", r_repos:"repos", r_leaks:"leak(s)",
    fresh:"FRESH", quiet:"quiet", findings_lc:"Findings (lifecycle)", no_findings:"no tracked findings",
    th_target:"target", th_class:"class", th_sev:"severity", th_status:"status", th_bounty:"bounty",
    k_live:"live", k_nonlive:"non-live", lf_kind:"class:", nonlive_hint:"non-live = real bug but the target is dead/empty/non-callable (no live impact)",
    parked_leads:"Parked leads", none_parked:"none parked", fires:"fires",
    parked_hidden:"parked — detail hidden in public mode", m_findings:"Findings",
    no_finding_t:"no finding logged for this target", m_verdicts:"Verdicts", no_verdicts:"no verdicts yet",
    fork_family:"fork family", no_siblings:"no siblings in registry", jump_hint:"click a sibling to jump (batch-CVE)",
    known_bugs:"known-bug rechecks (fingerprint)",
    kv_zones:"zones", kv_chains:"chains", kv_fork:"fork base", kv_owasp:"owasp", kv_sources:"sources",
    kv_first:"first seen", kv_updated:"updated", log_finding:"Log a finding (→ ledger + dashboard, one step)",
    finding_title:"finding title", log_btn:"log → finding", title_req:"title required",
    logged:"logged", failed:"failed", err_load:"Could not load lab-state",
    err_serve:"Serve from the repo root:", err_file:"Opening via file:// will not work (CORS + path).",
    foot:'source: <code>monitor/lab-state.json</code> (read-through projection) · serve via <code>python toolkit/dashboard.py</code> · mutations via MCP + HTTP bridge' }
};
let LANG = localStorage.getItem("lab_lang") || "ru";   // default Russian
// `tr` (not `t`) — several functions bind `t` to a TARGET object; this name avoids shadowing the translator.
const tr = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
// russian plural for "verdicts" (1 вердикт, 2-4 вердикта, 5+ вердиктов; en just adds s)
function verdictWord(n){
  if(LANG!=="ru") return n===1?tr("verdict_one"):tr("verdict_many");
  const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return tr("verdict_one");
  if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return tr("verdict_few");
  return tr("verdict_many");
}

// status REAL/DIG/CLEAN is what registry emits; PARK/SKIP are folded into CLEAN and recovered via `disposition`.
function colOf(t){
  if(t.status==="REAL") return "REAL";
  if(t.status==="DIG")  return "DIG";
  if(t.disposition==="park") return "PARK";
  if(t.disposition==="skip") return "SKIP";
  return "CLEAN";
}

function tile(k,v){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function targetCard(t){
  const meta = [t.zones&&t.zones.join(","), t.fork_base&&("fork:"+t.fork_base), t.chains&&t.chains.join(",")]
    .filter(Boolean).join(" · ");
  const lock = t.sensitivity==="high" ? `<span class="badge lock" title="parked exploitable lead — keep private">🔒</span>` : "";
  const nv = (t.verdicts||[]).length;
  const fn = (window.__state&&(window.__state.findings||[]).some(f=>(f.target||"").toLowerCase()===(t.id||"").toLowerCase()))?' 🐞':'';
  return `<div class="card clickable" data-id="${esc(t.id)}">
    <div class="nm">${esc(t.name||t.id)} ${lock}${fn}</div>
    <div class="meta">${esc(meta||"—")}${nv?` · ${nv} ${verdictWord(nv)}`:""}</div></div>`;
}

function board(targets){
  const buckets = Object.fromEntries(COLS.map(c=>[c,[]]));
  targets.forEach(t=>buckets[colOf(t)].push(t));
  return `<section><h2>${tr("pipeline")} — ${targets.length} ${tr("targets_n")}</h2><div class="board">` + COLS.map(c=>{
    const items = buckets[c];
    const cap = (c==="CLEAN"||c==="SKIP") ? 40 : 200;
    const cards = items.slice(0,cap).map(targetCard).join("") || `<div class="card meta" style="color:var(--dim)">—</div>`;
    const more = items.length>cap ? `<div class="card meta" style="color:var(--dim)">+${items.length-cap} ${tr("more")}</div>` : "";
    return `<div class="col"><h3><span class="h-${c}"><span class="dot d-${c}"></span> ${c}</span>
      <span class="n">${items.length}</span></h3>${cards}${more}</div>`;
  }).join("") + `</div></section>`;
}

function radarRow(name,counts,fresh){
  const f = (fresh&&fresh.length) ? `<span class="fresh">▲ ${fresh.length} ${tr("fresh")}</span>` : `<span class="quiet">${tr("quiet")}</span>`;
  return `<div class="row"><div>${name}<div class="sub">${counts}</div></div><div>${f}</div></div>`;
}

function radars(rd){
  const q=rd.queue||{}, fd=rd.freshdeploy||{}, ff=rd.freshfeed||{}, sc=rd.secrets||{};
  return `<div class="panel">
    ${radarRow(tr("r_change"), `${tr("r_impl")} ${q.impl_upgrades||0} · ${tr("r_bounty")} ${q.bounty_launches||0}`, q.fresh_items)}
    ${radarRow(tr("r_fresh_deploy"), `${fd.watched||0} ${tr("r_watched")}`, fd.fresh_items)}
    ${radarRow(tr("r_fresh_feed"), `${ff.seen||0} ${tr("r_listed")}`, ff.fresh_items)}
    ${radarRow(tr("r_secrets"), `${sc.repos||0} ${tr("r_repos")} · ${sc.leaks||0} ${tr("r_leaks")}`, sc.fresh_items)}
  </div>`;
}

function findings(F){
  if(!F.length) return `<div class="panel"><div class="row sub">${tr("no_findings")}</div></div>`;
  const sorted=[...F].sort((a,b)=>((a.kind==="non-live")-(b.kind==="non-live")));   // live first, non-live below
  const rows = sorted.map(f=>{
    const k=(f.kind==="non-live")?"non-live":"live";
    return `<tr class="${k==="non-live"?"nonlive":""}">
    <td>${esc(f.target||"")}</td>
    <td><span class="pill k-${k}">${tr(k==="non-live"?"k_nonlive":"k_live")}</span></td>
    <td>${esc(f.sev_claimed||"?")}${f.sev_awarded?` → ${esc(f.sev_awarded)}`:""}</td>
    <td><span class="pill st-${esc(f.status||"")}">${esc(f.status||"?")}</span></td>
    <td>${f.bounty_received?("$"+f.bounty_received):"—"}</td></tr>`;}).join("");
  const hasNon = F.some(f=>f.kind==="non-live");
  const hint = hasNon ? `<div class="row sub" style="border:0;padding-top:4px">${tr("nonlive_hint")}</div>` : "";
  return `<table><tr><th>${tr("th_target")}</th><th>${tr("th_class")}</th><th>${tr("th_sev")}</th><th>${tr("th_status")}</th><th>${tr("th_bounty")}</th></tr>${rows}</table>${hint}`;
}

function parked(P){
  if(!P.length) return `<div class="panel"><div class="row sub">${tr("none_parked")}</div></div>`;
  return `<div class="panel">`+P.map(p=>`<div class="row"><div>${esc(p.title||p.id)}
    <div class="sub">${tr("fires")}: ${esc(p.fire_means||"?")}</div></div></div>`).join("")+`</div>`;
}

function render(s){
  window.__state = s;
  document.getElementById("gen").textContent = tr("generated")+" "+(s.generated||"?")+" · v"+(s.version||"?");
  document.getElementById("targetlist").innerHTML =
    (s.targets||[]).map(t=>`<option value="${esc(t.name||t.id)}">`).join("");
  const pub = !!s._public;
  document.getElementById("verdictbar").style.display = pub ? "none" : "";   // no mutations in public mode
  if(pub) document.getElementById("gen").textContent += "  ·  "+tr("pub");
  const m=s.metrics||{}, p=m.precision||{}, r=m.recall||{};
  const byStatus = {};
  (s.targets||[]).forEach(t=>{const c=colOf(t);byStatus[c]=(byStatus[c]||0)+1;});
  const tiles = tile(tr("t_targets"), (s.targets||[]).length)
    + tile(tr("t_real_dig"), `${byStatus.REAL||0} / ${byStatus.DIG||0}`)
    + tile(tr("t_findings"), (s.findings||[]).length)
    + tile(tr("t_parked"), (s.parked||[]).length)
    + tile(tr("t_repos"), (s.repos||[]).length)
    + tile(tr("t_precision"), p.value==null?"n/a":p.value)
    + tile(tr("t_recall"), r.value==null?"n/a":r.value);
  document.getElementById("app").innerHTML =
    `<div class="tiles">${tiles}</div>`
    + board(s.targets||[])
    + `<section><h2>${tr("radars")}</h2>${radars(s.radars||{})}</section>`
    + `<section class="grid2">
        <div><h2>${tr("findings_lc")}</h2>${findings(s.findings||[])}</div>
        <div><h2>${tr("parked_leads")}</h2>${pub
            ? `<div class="panel"><div class="row sub">${s.parked_count||0} ${tr("parked_hidden")}</div></div>`
            : parked(s.parked||[])}</div>
       </section>`;
}

// Prefer the live bridge (/api/state = fresh re-derive); fall back to the static file (plain http.server).
function loadState(){
  return fetch(apiUrl("/api/state"),{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .catch(()=>fetch("/monitor/lab-state.json",{cache:"no-store"}).then(r=>{
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }));
}
function refresh(){ return loadState().then(render); }

function showErr(e){
  document.getElementById("app").innerHTML =
    `<div class="err">${tr("err_load")} (${esc(e&&e.message||e)}).<br><br>
     ${tr("err_serve")} <code>python toolkit/dashboard.py</code>.<br>${tr("err_file")}</div>`;
}

// verdict mutation -> POST /api/record_verdict (the HTTP bridge over labcore) -> re-derive + re-render
const $ = id => document.getElementById(id);
$("v_btn").addEventListener("click", ()=>{
  const target=$("v_target").value.trim(), verdict=$("v_verdict").value, reason=$("v_reason").value.trim();
  const msg=$("v_msg");
  if(!target||!reason){ msg.className="vmsg bad"; msg.textContent=tr("reason_req"); return; }
  $("v_btn").disabled=true; msg.className="vmsg"; msg.textContent=tr("saving");
  fetch("/api/record_verdict",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({target,verdict,reason})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(!ok||j.error){ msg.className="vmsg bad"; msg.textContent="✗ "+(j.error||tr("failed")); return; }
      msg.className="vmsg ok"; msg.textContent="✓ "+tr("saved")+" ("+esc(j.verdict)+")"; $("v_reason").value="";
      return refresh();
    })
    .catch(e=>{ msg.className="vmsg bad"; msg.textContent="✗ "+tr("bridge_off"); })
    .finally(()=>{ $("v_btn").disabled=false; });
});

// --- apply the static chrome (header/verdictbar/footer) + language toggle (default ru, persisted) ---
function applyChrome(){
  $("subtitle").textContent = tr("subtitle");
  $("lbl_rv").textContent = tr("record_verdict");
  $("v_target").placeholder = tr("target_name");
  $("v_reason").placeholder = tr("reason_why");
  $("v_btn").textContent = tr("save_ledger");
  $("foot").innerHTML = tr("foot");
  $("langbtn").textContent = LANG==="ru" ? "EN" : "RU";   // shows the language you'll switch TO
  document.documentElement.lang = LANG;
}
$("langbtn").addEventListener("click", ()=>{
  LANG = LANG==="ru" ? "en" : "ru";
  localStorage.setItem("lab_lang", LANG);
  applyChrome();
  if(window.__state) render(window.__state); else loadState().then(render).catch(showErr);
});
applyChrome();

// --- clickable target card -> detail modal: project info + verdicts + its bug + one-step log-finding ---
const modal = document.createElement("div"); modal.className = "modal"; document.body.appendChild(modal);
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("show"); });
function findingsFor(id){ return (((window.__state||{}).findings)||[]).filter(f=>(f.target||"").toLowerCase()===(id||"").toLowerCase()); }
function openDetail(id){
  const s = window.__state||{}; const t = (s.targets||[]).find(x=>x.id===id); if(!t) return;
  const kv=(k,v)=> (v&&v.length)? `<div class="k">${esc(k)}</div><div>${esc(Array.isArray(v)?v.join(", "):v)}</div>`:"";
  const verds=(t.verdicts||[]).map(v=>`<div class="vi"><b>${esc(v.verdict)}</b> <span class="vt">${esc(v.detector||"")} · ${esc(v.date||"")}</span><br>${esc((v.reason||"").slice(0,220))}</div>`).join("") || `<div class="row sub">${tr("no_verdicts")}</div>`;
  const sibs=t.fork_base ? (s.targets||[]).filter(x=>x.fork_base===t.fork_base && x.id!==t.id) : [];
  const forkfam=t.fork_base ? `<div class="mh2">${tr("fork_family")}: <span class="badge">${esc(t.fork_base)}</span> <span class="vt">${tr("jump_hint")}</span></div>`
    + (sibs.length ? `<div>`+sibs.map(x=>`<span class="fchip" data-id="${esc(x.id)}"><span class="dot d-${colOf(x)}"></span> ${esc(x.name||x.id)}</span>`).join("")+`</div>` : `<div class="row sub">${tr("no_siblings")}</div>`) : "";
  const det=t.detect, fpr=(det&&det.fingerprints)||[];
  const dch=f=>`<span class="dchip d-${f.verdict==='vuln?'?'v':(f.verdict==='safe'?'s':'n')}" title="${esc(f.desc||'')}">${f.verdict==='vuln?'?'⚠ ':''}${esc(f.id)} · ${esc(f.verdict)}</span>`;
  const naCount=fpr.filter(f=>f.verdict==='n/a').length;
  const detect=det ? `<div class="mh2">${tr("known_bugs")} <span class="vt">${esc(det.generated||'')}</span></div>`
    + fpr.filter(f=>f.verdict!=='n/a').map(dch).join("") + (naCount?`<span class="dchip d-n">n/a · ${naCount}</span>`:"") : "";
  const finds=findingsFor(id).map(f=>{const k=(f.kind==="non-live")?"non-live":"live";
    return `<div class="find">🐞 <b>${esc(f.title||"")}</b> <span class="pill k-${k}">${tr(k==="non-live"?"k_nonlive":"k_live")}</span><br><span class="vt">sev ${esc(f.sev_claimed||"?")}${f.sev_awarded?" → "+esc(f.sev_awarded):""} · ${esc(f.status||"")} · ${esc(f.file||"")}${f.line?":"+esc(f.line):""}${f.bounty_received?" · $"+esc(f.bounty_received):""}</span></div>`;}).join("") || `<div class="row sub">${tr("no_finding_t")}</div>`;
  modal.innerHTML = `<div class="modal-card">
    <div class="mh"><span class="dot d-${colOf(t)}"></span><h2>${esc(t.name||t.id)}</h2>
      <span class="badge h-${colOf(t)}">${esc(t.status)}${t.disposition?"/"+esc(t.disposition):""}</span>
      ${t.sensitivity==="high"?'<span class="badge lock">🔒 high</span>':""}<button class="x" id="mx">✕</button></div>
    <div class="mb">
      <div class="kv">${kv(tr("kv_zones"),t.zones)}${kv(tr("kv_chains"),t.chains)}${kv(tr("kv_fork"),t.fork_base)}${kv(tr("kv_owasp"),t.owasp)}${kv(tr("kv_sources"),t.sources)}${kv(tr("kv_first"),t.firstseen)}${kv(tr("kv_updated"),t.lastupdated)}</div>
      <div class="mh2">${tr("m_findings")}</div>${finds}
      ${detect}
      <div class="mh2">${tr("m_verdicts")} (${(t.verdicts||[]).length})</div><div class="vlist">${verds}</div>
      ${forkfam}
      ${s._public?"":`<div class="mh2">${tr("log_finding")}</div>
        <div class="logf"><input class="t" id="lf_title" placeholder="${tr("finding_title")}" autocomplete="off">
          <select id="lf_sev"><option>low</option><option>low-med</option><option>medium</option><option>high</option><option>critical</option></select>
          <select id="lf_kind"><option value="live">live</option><option value="non-live">non-live</option></select>
          <select id="lf_status"><option>drafted</option><option>disclosed</option><option>accepted</option><option>disputed</option></select>
          <button id="lf_btn">${tr("log_btn")}</button><span id="lf_msg" class="vmsg"></span></div>`}
    </div></div>`;
  modal.classList.add("show");
  document.getElementById("mx").onclick = ()=>modal.classList.remove("show");
  const b = document.getElementById("lf_btn");
  if(b) b.onclick = ()=>{
    const title=$("lf_title").value.trim(), msg=$("lf_msg");
    if(!title){ msg.className="vmsg bad"; msg.textContent=tr("title_req"); return; }
    b.disabled=true; msg.className="vmsg"; msg.textContent=tr("saving");
    fetch(apiUrl("/api/record_finding"),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target:t.name||t.id, title, sev:$("lf_sev").value, kind:$("lf_kind").value, status:$("lf_status").value})})
      .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
        if(!ok||j.error){ msg.className="vmsg bad"; msg.textContent="✗ "+(j.error||tr("failed")); return; }
        msg.className="vmsg ok"; msg.textContent="✓ "+tr("logged"); return refresh().then(()=>openDetail(id));
      }).catch(()=>{ msg.className="vmsg bad"; msg.textContent="✗ "+tr("bridge_off"); })
      .finally(()=>{ b.disabled=false; });
  };
}
document.addEventListener("click", e=>{ const c=e.target.closest(".card.clickable[data-id], .fchip[data-id]"); if(c) openDetail(c.getAttribute("data-id")); });

loadState().then(render).catch(showErr);
</script>
</body>
</html>
