<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>security-lab · dashboard</title>
<!--
  Read-only view over the lab-state CONTRACT (monitor/lab-state.json), plus per-finding detail
  (/api/finding_detail) and the two mutations (record_verdict / record_finding) over the localhost bridge.
  Self-contained: no framework, no CDN, works offline. Serve from the repo root (toolkit/lab_http.py).
-->
<style>
  :root{
    /* neutrals (dark, cool) */
    --bg:#0b0e13; --surface:#111621; --surface2:#161c28; --raise:#1b2331;
    --border:#222c3b; --border2:#303c4e;
    --txt:#e7ecf4; --txt2:#9fadc2; --txt3:#6c7a90;
    /* accent (actions + current nav only) */
    --acc:#6ea8ff; --acc-ink:#08111f; --acc-soft:#16233a;
    /* pipeline status */
    --real:#ff5c7a; --dig:#ffb454; --park:#5cc8ff; --skip:#5a6678; --clean:#3fb37f;
    /* severity */
    --crit:#ff415f; --high:#ff8a4c; --med:#ffc251; --low:#79b8ff;
    /* liveness */
    --live:#40c187; --dorm:#8894a8; --drain:#ff415f;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sh:0 6px 22px -8px rgba(0,0,0,.55);
    --r:11px;
  }
  *{box-sizing:border-box}
  html{scrollbar-color:var(--border2) var(--bg)}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.1px}
  .mono,code,pre,.addr,.num{font-family:var(--mono)}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  button{font-family:inherit}
  ::selection{background:var(--acc-soft)}

  /* ---- top bar + nav ---- */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,14,19,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:22px;padding:0 22px;height:56px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .brand .mark{width:9px;height:9px;border-radius:2px;background:var(--acc)}
  .brand b{color:var(--txt)} .brand span{color:var(--txt3);font-weight:500}
  nav.tabs{display:flex;gap:2px;margin-left:6px}
  .tab{appearance:none;background:none;border:0;color:var(--txt2);font-size:13.5px;font-weight:550;
    padding:8px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;line-height:1;
    transition:color .15s,background .15s}
  .tab:hover{color:var(--txt);background:var(--surface2)}
  .tab.on{color:var(--txt);background:var(--acc-soft)}
  .tab .cnt{font:600 11px/1 var(--mono);color:var(--txt3);background:var(--bg);border:1px solid var(--border);
    border-radius:20px;padding:2px 6px}
  .tab.on .cnt{color:var(--acc);border-color:var(--acc)}
  .spacer{flex:1}
  .tool{appearance:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
    border:1px solid var(--border);color:var(--txt2);border-radius:8px;padding:7px 11px;font-size:12.5px;
    font-weight:550;cursor:pointer;transition:.15s}
  .tool:hover{color:var(--txt);border-color:var(--border2)}
  .tool:focus-visible,.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--acc);outline-offset:1px}
  .pubtag{color:var(--dig);border-color:var(--dig)}
  #notifbtn.on{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent)}
  #notifbtn.off{color:var(--txt3)}
  .alertbanner{display:none;align-items:center;gap:10px;max-width:1220px;margin:12px auto 0;padding:11px 15px;
    background:color-mix(in srgb,var(--crit) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);
    border-radius:var(--r);font-size:13px;color:var(--txt)}
  .alertbanner.show{display:flex}
  .alertbanner .ab-dot{width:9px;height:9px;border-radius:50%;background:var(--crit);flex:0 0 auto}
  .alertbanner b{color:var(--crit)}
  .alertbanner .ab-x{margin-left:auto;background:none;border:0;color:var(--txt2);cursor:pointer;font-size:15px}
  .alertbanner .ab-x:hover{color:var(--txt)}

  main{max-width:1220px;margin:0 auto;padding:22px}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 16px;flex-wrap:wrap}
  .pagehead h1{font-size:19px;font-weight:640;margin:0;letter-spacing:.2px}
  .pagehead .sub{color:var(--txt3);font-size:13px;margin-top:3px}
  .eyebrow{color:var(--txt3);font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;margin:22px 0 10px}
  .eyebrow:first-child{margin-top:0}

  /* ---- stat strip ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
  .stat .v{font:600 23px/1.1 var(--mono);color:var(--txt)}
  .stat .k{color:var(--txt2);font-size:12px;margin-top:5px}
  .stat.click{cursor:pointer;transition:.15s} .stat.click:hover{border-color:var(--border2);background:var(--surface2)}
  .stat .v .s2{color:var(--txt3);font-size:16px}

  /* ---- generic panels / rows ---- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .panel + .panel{margin-top:10px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px}
  .prow + .prow{border-top:1px solid var(--border)}
  .prow .sub{color:var(--txt2);font-size:12px;margin-top:2px}
  .empty{padding:26px 16px;text-align:center;color:var(--txt3);font-size:13px}
  .empty .big{font-size:15px;color:var(--txt2);margin-bottom:4px}

  /* ---- finding cards (the hero) ---- */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .fcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;
    cursor:pointer;transition:border-color .15s,transform .12s,box-shadow .15s;display:flex;flex-direction:column;gap:9px}
  .fcard:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--sh)}
  .fcard .top{display:flex;align-items:center;gap:8px}
  .fcard .nm{font-weight:620;font-size:14.5px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcard .desc{color:var(--txt2);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fcard .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}

  /* severity chip */
  .sev{font:600 11px/1 var(--sans);letter-spacing:.3px;padding:4px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
  .sev-critical{color:#fff;background:var(--crit)} .sev-high{color:#211006;background:var(--high)}
  .sev-medium{color:#241a04;background:var(--med)} .sev-low,.sev-lowmed{color:var(--low);background:var(--acc-soft)}
  .sev-unknown{color:var(--txt2);background:var(--surface2)}

  /* live badge */
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;
    border-radius:20px;border:1px solid var(--border)}
  .live .d{width:7px;height:7px;border-radius:50%}
  .live-funded{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent)} .live-funded .d{background:var(--live)}
  .live-dormant{color:var(--dorm)} .live-dormant .d{background:var(--dorm)}
  .live-drained{color:var(--drain);border-color:color-mix(in srgb,var(--drain) 45%,transparent)} .live-drained .d{background:var(--drain)}
  .live-unknown{color:var(--txt3)} .live-unknown .d{background:var(--txt3)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);
    background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .lock{color:var(--dig)}

  /* ---- pipeline board ---- */
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-height:56px;
    max-height:64vh;overflow:auto;display:flex;flex-direction:column}
  .col h3{margin:0;padding:10px 12px;position:sticky;top:0;background:var(--surface2);z-index:1;
    border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
    font-size:12px;font-weight:650;letter-spacing:.4px}
  .col h3 .n{font:600 12px/1 var(--mono);color:var(--txt3)}
  .tcard{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
  .tcard:last-child{border-bottom:0} .tcard:hover{background:var(--surface2)}
  .tcard .nm{font-weight:560;font-size:13px;display:flex;gap:6px;align-items:center}
  .tcard .meta{color:var(--txt3);font-size:11.5px;margin-top:3px;font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .d-REAL{background:var(--real)} .d-DIG{background:var(--dig)} .d-PARK{background:var(--park)}
  .d-SKIP{background:var(--skip)} .d-CLEAN{background:var(--clean)}
  .h-REAL{color:var(--real)} .h-DIG{color:var(--dig)} .h-PARK{color:var(--park)} .h-SKIP{color:var(--skip)} .h-CLEAN{color:var(--clean)}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 15px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  th{color:var(--txt3);text-transform:uppercase;font-size:10.5px;letter-spacing:.6px;font-weight:650}
  tbody tr{cursor:pointer;transition:background .12s} tbody tr:hover{background:var(--surface2)}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--txt2);white-space:nowrap}
  .st-accepted,.st-fixed-silent,.st-duplicate{color:var(--clean);border-color:color-mix(in srgb,var(--clean) 45%,transparent)}
  .st-withdrawn,.st-disputed{color:var(--skip);border-color:var(--skip)}
  .st-drafted,.st-parked,.st-disclosed{color:var(--dig);border-color:color-mix(in srgb,var(--dig) 45%,transparent)}
  .k-live{color:var(--live);border-color:color-mix(in srgb,var(--live) 40%,transparent)}
  .k-non-live{color:var(--skip);border-color:var(--skip)}
  tr.nonlive{opacity:.6}

  /* ---- buttons + forms ---- */
  .btn{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--txt);
    border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:7px;line-height:1}
  .btn:hover{border-color:var(--border2);background:var(--raise)}
  .btn-primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
  .btn-primary:hover{background:#83b6ff;border-color:#83b6ff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11.5px;color:var(--txt2);font-weight:600}
  input,select{background:var(--bg);color:var(--txt);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font:13px var(--sans)} input:hover,select:hover{border-color:var(--border2)}
  input::placeholder{color:var(--txt3)}
  .toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;margin-bottom:14px}
  .toolbar .grow{flex:1;min-width:170px}
  .msg{font-size:12.5px;font-weight:600} .msg.ok{color:var(--live)} .msg.bad{color:var(--crit)}

  /* ---- detail page ---- */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--txt2);background:none;border:0;
    font-size:13px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:10px}
  .back:hover{color:var(--txt)}
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .dhead h1{font-size:22px;font-weight:660;margin:0;letter-spacing:.1px}
  .dhead .addr{color:var(--txt3);font-size:12.5px}
  .dgrid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start;margin-top:16px}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:7px 14px;font-size:13px}
  .kv .k{color:var(--txt2)} .kv .v{color:var(--txt);word-break:break-word}
  .sect{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;margin-bottom:14px}
  .sect > h2{font-size:13px;font-weight:650;margin:0 0 11px;letter-spacing:.2px;color:var(--txt);
    display:flex;align-items:center;gap:8px}
  .sect > h2 .hint{color:var(--txt3);font-size:11.5px;font-weight:500;margin-left:auto}
  .vi{padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;font-size:12.5px;background:var(--surface2)}
  .vi:last-child{margin-bottom:0} .vt{color:var(--txt3)}
  .vi b{color:var(--txt)}
  .fchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;padding:5px 9px;margin:0 6px 6px 0;
    border:1px solid var(--border);border-radius:8px;background:var(--surface2);transition:.15s}
  .fchip:hover{border-color:var(--acc);color:var(--txt)}
  .dchip{display:inline-block;font-size:11.5px;padding:3px 8px;margin:0 6px 6px 0;border-radius:7px;border:1px solid var(--border);color:var(--txt2)}
  .dchip.d-v{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
  .dchip.d-s{color:var(--clean);border-color:color-mix(in srgb,var(--clean) 45%,transparent)}
  /* liveness + events + md render */
  .livebox{display:flex;flex-direction:column;gap:8px}
  .livebox .meta{color:var(--txt2);font-size:12.5px}
  .wev{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin:7px 0;font-size:12.5px}
  .wev .tp{font-weight:700} .wev-HIGH .tp{color:var(--crit)} .wev-MED .tp{color:var(--dig)}
  .mdbox{max-height:520px;overflow:auto;font-size:13px;line-height:1.6}
  .mdbox h2,.mdbox h3,.mdbox h4{color:var(--txt);font-size:13.5px;font-weight:650;margin:16px 0 6px;letter-spacing:.1px}
  .mdbox h2:first-child,.mdbox h3:first-child{margin-top:2px}
  .mdbox p{margin:8px 0;color:var(--txt2)} .mdbox b{color:var(--txt);font-weight:650}
  .mdbox li{margin:3px 0 3px 18px;list-style:disc;color:var(--txt2)}
  .mdbox code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 4px;color:var(--med);font-size:12px}
  .mdbox pre.code{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 13px;
    overflow:auto;white-space:pre;color:#c3cee0;font-size:12px;line-height:1.5;margin:9px 0}
  .badge{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--txt2)}

  .foot{color:var(--txt3);padding:22px;text-align:center;font-size:12px;border-top:1px solid var(--border);margin-top:26px}
  .foot code{color:var(--txt2)}
  .errbox{padding:40px 22px;color:var(--crit);max-width:640px;margin:0 auto;text-align:center}

  @media(max-width:900px){
    .board{grid-template-columns:repeat(2,1fr)} .dgrid{grid-template-columns:1fr}
    nav.tabs .tab span.lbl{display:none} main{padding:16px}
  }
  @media(max-width:560px){ .board{grid-template-columns:1fr} .topbar{gap:10px;padding:0 14px} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><b>security</b><span>-lab</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <button class="tool" id="notifbtn" title="notifications">🔔</button>
  <button class="tool" id="refreshbtn" title="reload">↻ <span id="refreshlbl">refresh</span></button>
  <button class="tool" id="langbtn" title="язык / language">RU</button>
</header>
<div id="alertbanner" class="alertbanner" role="alert"></div>
<main id="app"><div class="empty"><div class="big" id="loadmsg">loading…</div></div></main>
<div class="foot" id="foot"></div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const apiUrl = p => p + (TOKEN ? (p.includes("?")?"&":"?")+"token="+encodeURIComponent(TOKEN) : "");
const $ = id => document.getElementById(id);

/* ---------- i18n (ru default + en); translate CHROME only, data stays as-is ---------- */
const I18N = {
 ru:{ loading:"загрузка…", refresh:"обновить", generated:"сгенерировано", pub:"публичный · очищено",

   fnd_title:"Находки", fnd_sub:"подтверждённые баги — клик открывает карточку с исходниками и live-статусом",

   wt_events:"События изменений (watch)", wt_radars:"Радары", wt_parked:"Запаркованные лиды",
   no_events:"событий пока нет — базовая точка снята; FUNDED / DRAINED / CODE-CHANGE появятся здесь",
   no_findings_attn:"нет живых находок, требующих внимания", no_findings:"нет отслеживаемых находок",

   k_live:"live", k_nonlive:"non-live",
   record_verdict:"Записать вердикт", target_name:"имя цели", reason_why:"причина (почему)",
   save_ledger:"в ledger →", reason_req:"нужны цель + причина", saving:"сохранение…", saved:"сохранено",
   bridge_off:"мост офлайн — запусти lab_http.py", failed:"ошибка",
   back:"назад", d_summary:"Сводка", d_liveness:"Актуальность / слежение", d_events:"События изменений",
   d_bugs:"Баги, исходники и фикс", d_verdicts:"Вердикты", d_known:"Известные баги (fingerprint)",
   d_fork:"Форк-семья", d_log:"Записать находку", no_verdicts:"вердиктов пока нет",
   no_finding_md:"нет FINDING.md для этой цели", no_watch:"нет данных мониторинга",
   kv_zones:"зоны", kv_chains:"сети", kv_owasp:"owasp", kv_sources:"источники", kv_first:"впервые",
   kv_updated:"обновлено", kv_addr:"адрес", jump_hint:"клик по сиблингу — прыжок (batch-CVE)",
   no_siblings:"нет сиблингов", finding_title:"название находки", log_btn:"записать →", title_req:"нужно название",
   logged:"записано", value:"баланс", checked:"проверено", active:"активен", quiet:"тихо", idle:"простой",
   funded:"LIVE · есть средства", dormant:"dormant / пусто", drained:"СЛИТО",
   err_load:"Не удалось загрузить lab-state", err_serve:"Запусти из корня репо:", err_file:"file:// не сработает (CORS).",
   foot:'источник <code>monitor/lab-state.json</code> · мост <code>toolkit/lab_http.py</code> · white-hat, the researcher discloses' },
 en:{ loading:"loading…", refresh:"refresh", generated:"generated", pub:"public · sanitized",
   nav_overview:"Overview", nav_findings:"Findings", nav_targets:"Targets", nav_watch:"Watch",
   ov_title:"Overview", ov_sub:"the lab at a glance",
   s_findings:"findings", s_real:"REAL targets", s_dig:"digging (DIG)", s_targets:"targets total",
   s_parked:"parked", s_repos:"repos watched", s_precision:"precision", s_recall:"recall",

let LANG = localStorage.getItem("lab_lang") || "ru";
const tr = k => (I18N[LANG]&&I18N[LANG][k]) || I18N.en[k] || k;

/* ---------- helpers ---------- */
function colOf(t){
  if(t.status==="REAL") return "REAL";
  if(t.status==="DIG")  return "DIG";
  if(t.disposition==="park") return "PARK";
  if(t.disposition==="skip") return "SKIP";
  return "CLEAN";
}
const SEVRANK={critical:5,high:4,medium:3,"low-med":2,lowmed:2,low:1};
function sevClass(s){ s=(s||"").toLowerCase().replace(/[^a-z-]/g,""); if(s==="low-med"||s==="lowmed")return "lowmed"; return SEVRANK[s]?s:"unknown"; }
function findingsFor(id){ return (((window.__state||{}).findings)||[]).filter(f=>(f.target||"").toLowerCase()===(id||"").toLowerCase()); }
function latestReason(t){ if(t.last_reason) return t.last_reason; const v=t.verdicts||[]; return v.length?(v[v.length-1].reason||""):""; }
function reasonText(t){ return latestReason(t).replace(/^\s*\[[A-Z][^\]]*\]\s*/,"").trim(); }
function sevText(t){ // severity: from its first live finding, else parse the latest verdict/registry reason
  const f=findingsFor(t.id).find(x=>x.kind!=="non-live")||findingsFor(t.id)[0];
  if(f&&f.sev_claimed) return f.sev_claimed;
  const r=latestReason(t).toLowerCase();
  for(const s of ["critical","high","medium","low-med","low"]) if(r.includes(s)) return s;
  return t.status==="REAL"?"medium":"";
}

/* liveness (from finding_detail cache or a target's watch snapshot passed in) */
function liveKind(l){ if(!l) return "unknown"; return (l.value||0)>0 ? "funded" : "dormant"; }
function liveBadgeMini(l){
  const k=liveKind(l); const map={funded:tr("funded"),dormant:tr("dormant"),unknown:tr("no_watch")};
  return `<span class="live live-${k}"><span class="d"></span>${map[k]}</span>`;
}

/* ---------- data ---------- */
function loadState(){
  return fetch(apiUrl("/api/state"),{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .catch(()=>fetch("/monitor/lab-state.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }));
}
const DETAIL_CACHE={};
function loadDetail(id){
  if(DETAIL_CACHE[id]) return Promise.resolve(DETAIL_CACHE[id]);
  return fetch(apiUrl("/api/finding_detail?key="+encodeURIComponent(id)),{cache:"no-store"})
    .then(r=>r.json()).then(d=>{ if(d&&!d.error){DETAIL_CACHE[id]=d; return d;} return null; }).catch(()=>null);
}

let VIEW={tab:"overview",id:null};
function parseHash(){
  const h=(location.hash||"").replace(/^#\/?/,"");

  return {tab:"overview",id:null};
}

/* ---------- pages ---------- */
function statCard(v,k,onTab){ return `<div class="stat ${onTab?'click':''}" ${onTab?`data-tab="${onTab}"`:''}><div class="v">${v}</div><div class="k">${esc(k)}</div></div>`; }

function pageOverview(s){
  const m=s.metrics||{}, p=m.precision||{}, r=m.recall||{};
  const by={}; (s.targets||[]).forEach(t=>{const c=colOf(t);by[c]=(by[c]||0)+1;});
  const reals=(s.targets||[]).filter(t=>t.status==="REAL");
  const stats=`<div class="stats">
     ${statCard((s.findings||[]).length,tr("s_findings"),"findings")}
     ${statCard(by.REAL||0,tr("s_real"),"findings")}
     ${statCard(by.DIG||0,tr("s_dig"),"targets")}
     ${statCard((s.targets||[]).length,tr("s_targets"),"targets")}
     ${statCard((s.parked||[]).length,tr("s_parked"),"watch")}
     ${statCard(p.value==null?"n/a":p.value,tr("s_precision"))}
   </div>`;
  const attn = reals.length
    ? `<div class="fgrid">${reals.map(findingCard).join("")}</div>`

  const events = collectEvents(s).slice(0,6);
  const ev = events.length
    ? `<div class="panel">${events.map(e=>`<div class="prow"><div><b>${esc(e.type)}</b> <span class="chip" data-tab-id="${esc(e.key)}">${esc(e.key)}</span><div class="sub">${esc(e.detail||"")}</div></div><div class="vt mono" style="color:var(--txt3);font-size:11.5px">${esc((e.ts||'').slice(0,16).replace('T',' '))}</div></div>`).join("")}</div>`
    : `<div class="panel"><div class="empty">${tr("no_events")}</div></div>`;
  return `<div class="pagehead"><div><h1>${tr("ov_title")}</h1><div class="sub">${tr("ov_sub")}</div></div></div>
    ${stats}
    <div class="eyebrow">${tr("attention")} · <span style="text-transform:none;letter-spacing:0;font-weight:500">${tr("attention_sub")}</span></div>${attn}
    <div class="eyebrow">${tr("recent")}</div>${ev}`;
}

function findingCard(t){
  const sev=sevText(t), sc=sevClass(sev);
  const l = (DETAIL_CACHE[t.id]||{}).liveness;
  const meta=[ (t.chains&&t.chains[0]), (t.zones&&t.zones[0]) ].filter(Boolean).join(" · ");
  return `<div class="fcard" data-id="${esc(t.id)}">
    <div class="top">${sev?`<span class="sev sev-${sc}">${esc(sev)}</span>`:""}<span class="nm">${esc(t.name||t.id)}</span>${t.sensitivity==="high"?'<span class="lock" title="keep private">🔒</span>':''}</div>
    <div class="desc">${esc(reasonText(t)||"—")}</div>
    <div class="foot">${l?liveBadgeMini(l):""}${meta?`<span class="chip"><span class="dot d-${colOf(t)}"></span>${esc(meta)}</span>`:""}</div>
  </div>`;
}

function pageFindings(s){
  const reals=(s.targets||[]).filter(t=>t.status==="REAL")
    .sort((a,b)=>(SEVRANK[sevClass(sevText(b))]||0)-(SEVRANK[sevClass(sevText(a))]||0));
  const cards = reals.length ? `<div class="fgrid">${reals.map(findingCard).join("")}</div>`
    : `<div class="panel"><div class="empty"><div class="big">${tr("no_findings")}</div></div></div>`;
  return `<div class="pagehead"><div><h1>${tr("fnd_title")}</h1><div class="sub">${tr("fnd_sub")}</div></div></div>
    <div class="eyebrow">${tr("fnd_real")} · ${reals.length}</div>${cards}
    <div class="eyebrow">${tr("fnd_lifecycle")}</div>${findingsTable(s.findings||[])}`;
}

function findingsTable(F){
  if(!F.length) return `<div class="panel"><div class="empty">${tr("no_findings")}</div></div>`;
  const sorted=[...F].sort((a,b)=>((a.kind==="non-live")-(b.kind==="non-live")));
  const rows=sorted.map(f=>{const k=(f.kind==="non-live")?"non-live":"live"; const sc=sevClass(f.sev_claimed);
    return `<tr class="${k==="non-live"?"nonlive":""}" data-id="${esc(f.target||"")}">
      <td>${esc(f.target||"")}</td>
      <td><span class="pill k-${k}">${tr(k==="non-live"?"k_nonlive":"k_live")}</span></td>
      <td>${f.sev_claimed?`<span class="sev sev-${sc}">${esc(f.sev_claimed)}</span>`:"?"}${f.sev_awarded?` → ${esc(f.sev_awarded)}`:""}</td>
      <td><span class="pill st-${esc(f.status||"")}">${esc(f.status||"?")}</span></td>
      <td class="num">${f.bounty_received?("$"+f.bounty_received):"—"}</td></tr>`;}).join("");
  return `<div class="panel"><table><thead><tr><th>${tr("th_target")}</th><th>${tr("th_class")}</th><th>${tr("th_sev")}</th><th>${tr("th_status")}</th><th>${tr("th_bounty")}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function pageTargets(s){
  const COLS=["REAL","DIG","PARK","SKIP","CLEAN"];
  const buckets=Object.fromEntries(COLS.map(c=>[c,[]]));
  (s.targets||[]).forEach(t=>buckets[colOf(t)].push(t));
  const board=`<div class="board">`+COLS.map(c=>{
    const items=buckets[c], cap=(c==="CLEAN"||c==="SKIP")?40:200;
    const cards=items.slice(0,cap).map(t=>{
      const meta=[t.zones&&t.zones.join(","),t.fork_base&&("fork:"+t.fork_base),t.chains&&t.chains.join(",")].filter(Boolean).join(" · ");
      const nv=(t.verdicts||[]).length, fn=findingsFor(t.id).length?" 🐞":"";
      return `<div class="tcard" data-id="${esc(t.id)}"><div class="nm"><span class="dot d-${c}"></span>${esc(t.name||t.id)}${t.sensitivity==="high"?' 🔒':''}${fn}</div><div class="meta">${esc(meta||"—")}${nv?` · ${nv}v`:""}</div></div>`;
    }).join("")||`<div class="tcard meta" style="color:var(--txt3);cursor:default">—</div>`;
    const more=items.length>cap?`<div class="tcard meta" style="color:var(--txt3);cursor:default">+${items.length-cap}</div>`:"";
    return `<div class="col"><h3><span class="h-${c}">${c}</span><span class="n">${items.length}</span></h3>${cards}${more}</div>`;
  }).join("")+`</div>`;
  const form = s._public ? "" : `<div class="toolbar">
      <div class="field grow"><label>${tr("target_name")}</label><input id="v_target" list="targetlist" autocomplete="off"><datalist id="targetlist">${(s.targets||[]).map(t=>`<option value="${esc(t.name||t.id)}">`).join("")}</datalist></div>
      <div class="field"><label>verdict</label><select id="v_verdict"><option value="todo">todo</option><option value="real">real</option><option value="fp">fp</option><option value="known">known</option><option value="wontfix">wontfix</option></select></div>
      <div class="field grow"><label>${tr("reason_why")}</label><input id="v_reason" autocomplete="off"></div>
      <button class="btn btn-primary" id="v_btn">${tr("save_ledger")}</button><span id="v_msg" class="msg"></span></div>`;
  return `<div class="pagehead"><div><h1>${tr("tg_title")}</h1><div class="sub">${tr("tg_sub")}</div></div></div>${form}${board}`;
}

function collectEvents(s){
  const w=(s.watch&&s.watch.events)||window.__events||[];
  return [...w].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
}
function pageWatch(s){
  const events=collectEvents(s);
  const ev = events.length
    ? `<div class="panel">${events.map(e=>`<div class="wev wev-${esc(e.sev||'')}"><span class="tp">${esc(e.type||'')}</span> <span class="chip" data-tab-id="${esc(e.key)}">${esc(e.key)}</span> <span class="vt">${esc((e.ts||'').slice(0,16).replace('T',' '))}</span><div style="color:var(--txt2);margin-top:4px">${esc(e.detail||'')}</div></div>`).join("")}</div>`
    : `<div class="panel"><div class="empty">${tr("no_events")}</div></div>`;
  const rd=s.radars||{}, q=rd.queue||{}, fd=rd.freshdeploy||{}, ff=rd.freshfeed||{}, sc=rd.secrets||{};
  const rrow=(nm,cnt,fresh)=>`<div class="prow"><div>${nm}<div class="sub">${cnt}</div></div><div>${(fresh&&fresh.length)?`<span class="sev sev-high">▲ ${fresh.length}</span>`:`<span class="chip">${tr("quiet")}</span>`}</div></div>`;
  const radars=`<div class="panel">
    ${rrow("change radar",`impl ${q.impl_upgrades||0} · bounty ${q.bounty_launches||0}`,q.fresh_items)}
    ${rrow("fresh-deploy",`${fd.watched||0} watched`,fd.fresh_items)}
    ${rrow("fresh-feed",`${ff.seen||0} listed`,ff.fresh_items)}
    ${rrow("secrets-sweep",`${sc.repos||0} repos · ${sc.leaks||0} leaks`,sc.fresh_items)}</div>`;
  const parked = s._public
    ? `<div class="panel"><div class="empty">${(s.parked_count||0)} ${tr("parked_hidden")}</div></div>`
    : ((s.parked||[]).length ? `<div class="panel">${(s.parked||[]).map(p=>`<div class="prow"><div>${esc(p.title||p.id)}<div class="sub">${esc(p.fire_means||"")}</div></div></div>`).join("")}</div>` : `<div class="panel"><div class="empty">${tr("none_parked")}</div></div>`);
  return `<div class="pagehead"><div><h1>${tr("wt_title")}</h1><div class="sub">${tr("wt_sub")}</div></div></div>
    <div class="eyebrow">${tr("wt_events")}</div>${ev}

    <div class="eyebrow">${tr("wt_parked")}</div>${parked}`;
}

/* ---------- markdown + detail render ---------- */
function mdToHtml(md){
  if(!md) return "";
  const blocks=[]; md=md.replace(/```[\w]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return "@@C"+(blocks.length-1)+"@@";});
  let h=esc(md);
  h=h.replace(/^\s{0,3}####?\s+(.*)$/gm,"<h4>$1</h4>").replace(/^\s{0,3}##\s+(.*)$/gm,"<h3>$1</h3>").replace(/^\s{0,3}#\s+(.*)$/gm,"<h2>$1</h2>");
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>");
  h=h.replace(/^\s*[-*]\s+(.*)$/gm,"<li>$1</li>");
  h=h.replace(/\n{2,}/g,"</p><p>"); h="<p>"+h+"</p>";
  h=h.replace(/@@C(\d+)@@/g,(m,i)=>"<pre class='code'>"+esc(blocks[+i].replace(/\s+$/,''))+"</pre>");
  return h;
}
function fmtVal(l){
  const v=Number(l.value||0);
  if(!v) return (l.token_sym?"0 "+l.token_sym:(l.token_dec!=null?"0":"0 ETH"));
  if(l.token_dec!=null){ const n=v/Math.pow(10,l.token_dec);
    const s=n.toLocaleString("en-US",{maximumFractionDigits:n>=1000?2:(l.token_dec>4?4:l.token_dec)});
    return s+" "+(l.token_sym||"tokens"); }
  if(l.token_sym||l.token_val!=null) return v.toLocaleString("en-US")+" "+(l.token_sym||"units");
  return (v/1e18).toLocaleString("en-US",{maximumFractionDigits:4})+" ETH";
}
function liveboxFull(d){
  const l=d.liveness; if(!l) return `<div class="empty">${tr("no_watch")}</div>`;
  const wt=d.watch_target||{};
  const act=(l.last_days!=null)?(l.last_days<7?tr("active"):(l.last_days<30?tr("quiet"):tr("idle")+" "+Math.round(l.last_days)+"d")):"";
  return `<div class="livebox">${liveBadgeMini(l)}
    <div class="meta">${tr("value")} <b class="mono">${esc(fmtVal(l))}</b>${act?` · ${act}`:""}${l.ts?` · ${tr("checked")} ${esc(l.ts.slice(0,16).replace("T"," "))}`:""}</div>
    ${wt.note?`<div class="vt" style="font-size:12px">${esc(wt.note)}</div>`:""}</div>`;
}
function eventsFull(d){
  const ev=(d.events||[]);
  if(!ev.length) return `<div class="empty">${tr("no_events")}</div>`;
  return ev.slice().reverse().map(e=>`<div class="wev wev-${esc(e.sev||'')}"><span class="tp">${esc(e.type||'')}</span> <span class="vt">${esc((e.ts||'').slice(0,16).replace('T',' '))}</span><div style="color:var(--txt2);margin-top:3px">${esc(e.detail||'')}</div></div>`).join("");
}

function pageDetail(s,id){
  const t=(s.targets||[]).find(x=>x.id===id);
  if(!t) return `<button class="back" data-back>← ${tr("back")}</button><div class="empty"><div class="big">${esc(id)}</div>not a known target</div>`;
  const sev=sevText(t), sc=sevClass(sev);
  const kv=(k,v)=>(v&&(Array.isArray(v)?v.length:true))?`<div class="k">${esc(k)}</div><div class="v${k===tr('kv_addr')?' addr':''}">${esc(Array.isArray(v)?v.join(", "):v)}</div>`:"";
  const verds=(t.verdicts||[]).map(v=>`<div class="vi"><b>${esc(v.verdict)}</b> <span class="vt">${esc(v.detector||"")} · ${esc(v.date||"")}</span><br>${esc((v.reason||"").slice(0,320))}</div>`).join("")||`<div class="empty">${tr("no_verdicts")}</div>`;
  const sibs=t.fork_base?(s.targets||[]).filter(x=>x.fork_base===t.fork_base&&x.id!==t.id):[];

  const det=t.detect,fpr=(det&&det.fingerprints)||[];
  const dch=f=>`<span class="dchip d-${f.verdict==='vuln?'?'v':(f.verdict==='safe'?'s':'n')}" title="${esc(f.desc||'')}">${f.verdict==='vuln?'?'⚠ ':''}${esc(f.id)} · ${esc(f.verdict)}</span>`;
  const naC=fpr.filter(f=>f.verdict==='n/a').length;
  const known=det?`<div class="sect"><h2>${tr("d_known")}<span class="hint">${esc(det.generated||'')}</span></h2>${fpr.filter(f=>f.verdict!=='n/a').map(dch).join("")}${naC?`<span class="dchip">n/a · ${naC}</span>`:""}</div>`:"";
  const logf = s._public?"":`<div class="sect"><h2>${tr("d_log")}</h2>
      <div class="toolbar" style="margin:0;border:0;padding:0;background:none">
        <div class="field grow"><input id="lf_title" placeholder="${tr("finding_title")}" autocomplete="off"></div>
        <div class="field"><select id="lf_sev"><option>low</option><option>low-med</option><option>medium</option><option>high</option><option>critical</option></select></div>
        <div class="field"><select id="lf_kind"><option value="live">live</option><option value="non-live">non-live</option></select></div>
        <div class="field"><select id="lf_status"><option>drafted</option><option>disclosed</option><option>accepted</option><option>disputed</option></select></div>
        <button class="btn btn-primary" id="lf_btn">${tr("log_btn")}</button><span id="lf_msg" class="msg"></span></div></div>`;

  const left=`<div>
    <div class="sect"><h2>${tr("d_liveness")}</h2><div id="d_live"><div class="empty">${tr("loading")}</div></div></div>
    <div class="sect"><h2>${tr("d_bugs")} <span id="d_pocpath" class="hint"></span></h2><div id="d_md" class="mdbox"><div class="empty">${tr("loading")}</div></div></div>
    ${known}${logf}</div>`;
  const right=`<div>
    <div class="sect"><h2>${tr("d_summary")}</h2><div class="kv">
      ${kv(tr("kv_addr"),(t.addresses&&t.addresses[0]))}${kv(tr("kv_chains"),t.chains)}${kv(tr("kv_zones"),t.zones)}
      ${kv(tr("kv_owasp"),t.owasp||t.owasp_classes)}${kv(tr("kv_sources"),t.sources)}${kv(tr("kv_first"),t.firstseen)}${kv(tr("kv_updated"),t.lastupdated)}</div></div>
    <div class="sect"><h2>${tr("d_verdicts")} <span class="hint">${(t.verdicts||[]).length}</span></h2>${verds}</div>
    <div class="sect"><h2>${tr("d_events")}</h2><div id="d_events"><div class="empty">${tr("loading")}</div></div></div>
    ${forkfam}</div>`;

  setTimeout(()=>hydrateDetail(id),0);
  return `<button class="back" data-back>← ${tr("back")}</button>
    <div class="dhead"><span class="dot d-${colOf(t)}" style="width:11px;height:11px"></span>
      <h1>${esc(t.name||t.id)}</h1>${sev?`<span class="sev sev-${sc}">${esc(sev)}</span>`:""}
      <span class="badge h-${colOf(t)}">${esc(t.status)}${t.disposition?"/"+esc(t.disposition):""}</span>
      ${t.sensitivity==="high"?'<span class="badge lock">🔒 high</span>':''}
      <span id="d_livebadge"></span></div>
    ${(t.addresses&&t.addresses[0])?`<div class="addr mono">${esc(t.addresses[0])}</div>`:""}
    <div class="dgrid">${left}${right}</div>`;
}
function hydrateDetail(id){
  loadDetail(id).then(d=>{
    if(!d) d={};
    const live=$("d_live"), md=$("d_md"), evb=$("d_events"), pp=$("d_pocpath"), lb=$("d_livebadge");
    if(live) live.innerHTML=liveboxFull(d);
    if(evb) evb.innerHTML=eventsFull(d);
    if(md) md.innerHTML=d.finding_md?mdToHtml(d.finding_md):`<div class="empty">${tr("no_finding_md")}</div>`;
    if(pp&&d.poc_path) pp.textContent="📄 "+d.poc_path;
    if(lb&&d.liveness) lb.innerHTML=liveBadgeMini(d.liveness);
  });
  const b=$("lf_btn"); if(b) b.onclick=()=>doLogFinding(id);
}

/* ---------- mutations ---------- */
function doRecordVerdict(){
  const target=$("v_target").value.trim(),verdict=$("v_verdict").value,reason=$("v_reason").value.trim(),msg=$("v_msg"),b=$("v_btn");
  if(!target||!reason){msg.className="msg bad";msg.textContent=tr("reason_req");return;}
  b.disabled=true;msg.className="msg";msg.textContent=tr("saving");
  fetch("/api/record_verdict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target,verdict,reason})})
    .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
      if(!ok||j.error){msg.className="msg bad";msg.textContent="✗ "+(j.error||tr("failed"));return;}
      msg.className="msg ok";msg.textContent="✓ "+tr("saved");$("v_reason").value="";refresh();
    }).catch(()=>{msg.className="msg bad";msg.textContent="✗ "+tr("bridge_off");}).finally(()=>{b.disabled=false;});
}
function doLogFinding(id){
  const t=(window.__state.targets||[]).find(x=>x.id===id)||{};
  const title=$("lf_title").value.trim(),msg=$("lf_msg"),b=$("lf_btn");
  if(!title){msg.className="msg bad";msg.textContent=tr("title_req");return;}
  b.disabled=true;msg.className="msg";msg.textContent=tr("saving");
  fetch(apiUrl("/api/record_finding"),{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({target:t.name||id,title,sev:$("lf_sev").value,kind:$("lf_kind").value,status:$("lf_status").value})})
    .then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
      if(!ok||j.error){msg.className="msg bad";msg.textContent="✗ "+(j.error||tr("failed"));return;}
      msg.className="msg ok";msg.textContent="✓ "+tr("logged");refresh();
    }).catch(()=>{msg.className="msg bad";msg.textContent="✗ "+tr("bridge_off");}).finally(()=>{b.disabled=false;});
}

/* ---------- app shell ---------- */
function renderTabs(s){
  const by={}; (s.targets||[]).forEach(t=>{const c=colOf(t);by[c]=(by[c]||0)+1;});
  const tabs=[["overview",tr("nav_overview"),""],["findings",tr("nav_findings"),(s.findings||[]).length||(by.REAL||"")],
    ["targets",tr("nav_targets"),(s.targets||[]).length],["watch",tr("nav_watch"),collectEvents(s).length||""]];
  $("tabs").innerHTML=tabs.map(([k,l,c])=>`<button class="tab ${VIEW.tab===k&&!VIEW.id?'on':''}" data-tab="${k}"><span class="lbl">${esc(l)}</span>${c!==""?`<span class="cnt">${esc(c)}</span>`:""}</button>`).join("");
}
function renderApp(){
  const s=window.__state; if(!s) return;
  renderTabs(s);
  const app=$("app");
  if(VIEW.id){ app.innerHTML=pageDetail(s,VIEW.id); }
  else if(VIEW.tab==="findings") app.innerHTML=pageFindings(s);
  else if(VIEW.tab==="targets"){ app.innerHTML=pageTargets(s); const b=$("v_btn"); if(b) b.onclick=doRecordVerdict; }
  else if(VIEW.tab==="watch") app.innerHTML=pageWatch(s);
  else app.innerHTML=pageOverview(s);
  window.scrollTo(0,0);
}
function render(s){
  window.__state=s;
  window.__events=(s.watch&&s.watch.events)||[];
  applyChrome(s);
  renderApp();
  // warm liveness for REAL targets so their live badges show on cards
  (s.targets||[]).filter(t=>t.status==="REAL").slice(0,12).forEach(t=>loadDetail(t.id).then(()=>{ if(!VIEW.id) { const c=document.querySelector(`.fcard[data-id="${CSS.escape(t.id)}"] .foot`); if(c&&DETAIL_CACHE[t.id]&&DETAIL_CACHE[t.id].liveness&&!c.querySelector(".live")) c.insertAdjacentHTML("afterbegin",liveBadgeMini(DETAIL_CACHE[t.id].liveness)); } }));
}
function refresh(){ Object.keys(DETAIL_CACHE).forEach(k=>delete DETAIL_CACHE[k]); return loadState().then(render); }
function showErr(e){ $("app").innerHTML=`<div class="errbox">${tr("err_load")} (${esc(e&&e.message||e)}).<br><br>${tr("err_serve")} <code>python toolkit/lab_http.py</code>.<br>${tr("err_file")}</div>`; }

function applyChrome(s){
  const pub=!!(s&&s._public);
  $("foot").innerHTML=tr("foot")+(pub?` · <b style="color:var(--dig)">${tr("pub")}</b>`:"")+(s&&s.generated?` · ${tr("generated")} ${esc(s.generated)}`:"");
  $("refreshlbl").textContent=tr("refresh");
  $("langbtn").textContent=LANG==="ru"?"EN":"RU";
  document.documentElement.lang=LANG;
}

/* events */
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]"); if(tab){ go(tab.getAttribute("data-tab")); return; }
  const idc=e.target.closest("[data-id]"); if(idc){ go(null,idc.getAttribute("data-id")); return; }
  const idt=e.target.closest("[data-tab-id]"); if(idt){ go(null,idt.getAttribute("data-tab-id")); return; }
  if(e.target.closest("[data-back]")){ if(history.length>1) history.back(); else go(VIEW.tab||"overview"); return; }
});
/* ---------- browser notifications for new HIGH watch-events (poll /api/watch_events) ---------- */
const NOTIF_SUPPORTED = ("Notification" in window);
function updateNotifBtn(){
  const b=$("notifbtn"); if(!b) return;
  const p = NOTIF_SUPPORTED ? Notification.permission : "unsupported";
  b.textContent = p==="granted" ? "🔔" : (p==="denied"||p==="unsupported" ? "🔕" : "🔔");
  b.className = "tool " + (p==="granted"?"on":(p==="denied"?"off":""));
  b.title = p==="granted" ? "browser alerts ON (click to test)"
          : p==="denied" ? "alerts blocked in the browser settings"
          : p==="unsupported" ? "this browser has no Notification API"
          : "enable browser alerts for DRAINED / FUNDED events";
}
function fireNotif(e){
  if(!NOTIF_SUPPORTED || Notification.permission!=="granted") return;
  try{ const n=new Notification("🚨 "+e.type+" · "+e.key, {body:(e.detail||"").slice(0,180), tag:"lab-"+(e.ts||"")});
    n.onclick=()=>{ window.focus(); go(null,e.key); n.close(); }; }catch(_){}
}
function showBanner(high){
  const b=$("alertbanner"); if(!b||!high.length) return;
  const o=high[0];
  b.innerHTML=`<span class="ab-dot"></span><b>${esc(o.type)}</b> · ${esc(o.key)} — ${esc((o.detail||"").slice(0,130))}`
    +`${high.length>1?` <span class="vt">(+${high.length-1})</span>`:""} <button class="ab-x" id="ab_x" title="dismiss">✕</button>`;
  b.classList.add("show");
  $("ab_x").onclick=()=>b.classList.remove("show");
  b.onclick=(e)=>{ if(e.target.id!=="ab_x") go(null,o.key); };
}
function pollAlerts(initial){
  fetch(apiUrl("/api/watch_events?n=25"),{cache:"no-store"}).then(r=>r.json()).then(evs=>{
    if(!Array.isArray(evs)||!evs.length) return;
    const last=localStorage.getItem("lab_seen_ts")||"";
    const fresh=evs.filter(e=>(e.ts||"")>last);
    localStorage.setItem("lab_seen_ts", evs[0].ts||last);   // evs newest-first
    if(initial) return;                                      // on first load just set the baseline, don't alert history
    const high=fresh.filter(e=>e.sev==="HIGH");
    if(high.length){ high.forEach(fireNotif); showBanner(high); }
  }).catch(()=>{});
}

$("notifbtn").addEventListener("click",()=>{
  if(!NOTIF_SUPPORTED) return;
  if(Notification.permission==="granted"){ new Notification("security-lab",{body:"alerts are on — DRAINED / FUNDED will notify here"}); return; }
  Notification.requestPermission().then(updateNotifBtn);
});
$("refreshbtn").addEventListener("click",()=>{ $("refreshbtn").disabled=true; refresh().finally(()=>$("refreshbtn").disabled=false); });
$("langbtn").addEventListener("click",()=>{ LANG=LANG==="ru"?"en":"ru"; localStorage.setItem("lab_lang",LANG); if(window.__state){applyChrome(window.__state);renderApp();} });

updateNotifBtn();
VIEW=parseHash();
loadState().then(render).catch(showErr);
pollAlerts(true);                                           // baseline on load (no alert for existing history)
setInterval(pollAlerts, 60000);                            // then poll every 60s for new HIGH events
</script>
</body>
